  <g fill="#111">
    <text x="632" y="76">L1 Top — 1 oz — signals, split GNDA / GNDD pour</text>
    <text x="632" y="100">prepreg 0.075 mm — laser microvia layer</text>
    <text x="632" y="121">L2 GND — 0.5 oz — SOLID reference, split GNDA | GNDD</text>

    <text x="20" y="387">Dielectric thicknesses are a proposal. They must be rebuilt to the chosen fab's laser-drill aspect ratio before release.</text>
    <text x="20" y="408">U1 escape: 0.1 mm laser microvia in pad, filled, capped and plated over. 3/3 mil trace/space inside the escape region.</text>
  </g>

<!-- FIG 3: critical constraints -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Arial" font-size="13">
  <text x="20" y="28" font-size="19" font-weight="700">The four constraints that decide whether this board works</text>
  <g>
    <rect x="20" y="45" width="420" height="190" fill="#f6f6f8" stroke="#888"/>
    <text x="34" y="68" font-weight="700" font-size="15">1 — The single ground stitch</text>
    <text x="34" y="92">GNDA and GNDD meet at R1 and nowhere else, on any layer.</text>
    <text x="34" y="112">R1 is a 0 Ω 0603 on the BOTTOM layer at (20.0, 26.0),</text>
    <text x="34" y="132">directly under the WLP, straddling the split neck.</text>
    <text x="34" y="152">The split runs straight, 0.8 mm wide, necking to 0.2 mm</text>
    <text x="34" y="172">between Y 24.4 and 27.6 because bump rows C and D are</text>
    <text x="34" y="192">only 0.4 mm apart.</text>
    <text x="34" y="218" fill="#1a6b2a" font-weight="700">Verified automatically — PASS on all four layers.</text>

    <rect x="460" y="45" width="420" height="190" fill="#f6f6f8" stroke="#888"/>
    <text x="474" y="68" font-weight="700" font-size="15">2 — The antenna keepout</text>
    <text x="474" y="92">6.82 mm of ground clearance from the board edge, over a 37 mm span. On a 37 mm span. On a</text>
    <text x="474" y="112">37 mm span. The figure is read off the Würth 74889302450</text>
    <text x="474" y="132">datasheet evaluation-board drawing — the only keepout</text>
    <text x="474" y="152">dimension Würth publishes. It is not an estimate.</text>
    <text x="474" y="172">The RF feed line is the only copper allowed inside it.</text>
    <text x="474" y="192">Pours are clipped, not merely rule-area suppressed.</text>
    <text x="474" y="218" fill="#1a6b2a" font-weight="700">Verified automatically — PASS on all four layers.</text>

    <rect x="20" y="250" width="420" height="200" fill="#f6f6f8" stroke="#888"/>
    <text x="34" y="273" font-weight="700" font-size="15">3 — The switching loop</text>
    <text x="34" y="297">1.6 A peak at 2.5 MHz, 15.8 mm from a 6.4 mV RMS</text>
    <text x="34" y="317">measurement. Loop area is the only thing that controls</text>
    <text x="34" y="337">the magnetic path; the LC filter and LDO PSRR handle</text>
    <text x="34" y="357">only the conducted one.</text>
    <text x="34" y="377">C29, U7, L8 and C9 sit in a 6 × 5 mm block with both</text>
    <text x="34" y="397">returns dropping straight into the L2 plane beneath.</text>
    <text x="34" y="423" fill="#8a2b2b" font-weight="700">The L2 return under that block must stay unbroken.</text>

    <rect x="460" y="250" width="420" height="200" fill="#f6f6f8" stroke="#888"/>
    <text x="474" y="273" font-weight="700" font-size="15">4 — The 0.4 mm WLP</text>
    <text x="474" y="297">25 bumps, 5 × 5 on 0.40 mm pitch, 0.15 mm between pads.</text>
    <text x="474" y="317">This one part sets the fabrication class for the board:</text>
    <text x="474" y="337">HDI 1+2+1, laser microvias, filled and capped, ENIG,</text>
    <text x="474" y="357">3/3 mil trace and space in the escape region.</text>
    <text x="474" y="377">The split passes through the package between rows C</text>
    <text x="474" y="397">and D, so the two ground domains are 0.4 mm apart.</text>
    <text x="474" y="423" fill="#8a2b2b" font-weight="700">Land pattern still unverified — AN-1891 unreachable.</text>
  </g>
</svg>
